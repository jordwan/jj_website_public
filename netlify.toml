[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# remnants API → Netlify Function (must come before the SPA fallback)
[[redirects]]
  from = "/api/remnants"
  to = "/.netlify/functions/remnants"
  status = 200

# client-side routes (/about, /portfolio) → index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
